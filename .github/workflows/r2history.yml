name: Price history to R2
# Once a day, after TCGplayer's update: today's price files → Cloudflare R2 bucket "minty-history" (build/r2history.js in the
# private job code). First run also copies the whole price history since Feb 2024. Never overwrites a saved day.
# Days older than 30 are folded into packed/ (changes only, checked by rebuilding each day) and their daily copy removed.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Days kept whole before folding (normally 30)'
        default: '30'
      reset:
        description: 'Remove packed files of an unfinished first run (1 = yes; refused once any day is folded)'
        default: '0'
  schedule:
    - cron: '13 17 * * *'
permissions:
  contents: write
concurrency:
  group: r2history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Job code (private project)
        uses: actions/checkout@v4
        with:
          repository: earnviacrypto/minty-jobs
          token: ${{ secrets.JOBS_TOKEN }}
          path: jobs
      - name: Use the job code for this run only
        run: cp -r jobs/build jobs/config.json jobs/package.json . && rm -rf jobs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Price history to R2
        run: node --max-old-space-size=12288 build/r2history.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KEEP: ${{ inputs.keep || '30' }}
          R2_RESET_PACKED: ${{ inputs.reset || '0' }}
