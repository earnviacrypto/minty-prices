# One-off: can the job read the makers' product pages? Results in the "checks" release (maker-check.tgz).
name: Maker check
on:
  push:
    paths: ['tools/maker-check.js', '.github/workflows/maker-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/maker-check.js
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: tar czf maker-check.tgz maker-check && gh release upload checks maker-check.tgz --clobber
