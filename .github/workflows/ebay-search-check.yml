# One-off: which eBay search link shapes find sold listings. Results in the "checks" release.
name: eBay search check
on:
  push:
    paths: ['tools/ebay-search-check.js', '.github/workflows/ebay-search-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/ebay-search-check.js
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload checks ebay-search-check.json --clobber
