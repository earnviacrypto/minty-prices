name: ref
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ref.yml', 'ref.txt', 'ref.py']
permissions:
  contents: write
jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reference slab photos
        run: python3 ref.py
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ref >/dev/null 2>&1 || gh release create ref --title ref --notes "temporary"
          ls out/* >/dev/null 2>&1 && gh release upload ref out/* --clobber || echo none
