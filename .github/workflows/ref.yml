name: ref
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ref.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the temporary reference pictures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete ref --yes --cleanup-tag || true
