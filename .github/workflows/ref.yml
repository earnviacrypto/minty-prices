name: ref
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ref.yml', 'ref.txt']
permissions:
  contents: write
jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reference slab photos
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          while IFS='|' read -r name q; do
            [ -z "$name" ] && continue
            curl -sL -A "$UA" -m 40 "https://www.ebay.com/sch/i.html?_nkw=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote_plus(sys.argv[1]))" "$q")&_sop=12" -o page.html || true
            echo "$name page $(wc -c < page.html)"
            grep -oE 'https://i\.ebayimg\.com/images/g/[A-Za-z0-9~_-]+/s-l[0-9]+\.(jpg|webp)' page.html | sed -E 's/s-l[0-9]+\./s-l1600./' | awk '!s[$0]++' | head -6 > urls.txt || true
            n=0; while read -r u; do n=$((n+1)); curl -sL -A "$UA" -m 40 -o "out/$name-$n.${u##*.}" "$u"; done < urls.txt
          done < ref.txt
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ref >/dev/null 2>&1 || gh release create ref --title ref --notes "temporary"
          ls out/* >/dev/null 2>&1 && gh release upload ref out/* --clobber || echo none
