name: Prices
# Every hour: does work only when TCGCSV has new prices (once a day) or archive days are still to be read.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 7-Zip
        run: which 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Check
        run: node build/test.js
      - name: Read prices
        run: node build/run.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_MINUTES: '300'
      - name: Deals
        if: always()
        run: node build/deals.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
