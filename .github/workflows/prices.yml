name: Prices
# Every hour: does work only when TCGCSV has new prices (once a day) or archive days are still to be read.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 */3 * * *' # second slot in case GitHub skips the first
  workflow_dispatch:
  push: # a change to the job runs it at once
    branches: [main]
    paths: ['.github/workflows/prices.yml', 'auth/refresh.enc']
permissions:
  contents: write
  actions: write # lets the job start its next run itself
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Job code (private project)
        uses: actions/checkout@v4
        with:
          repository: earnviacrypto/minty-jobs
          token: ${{ secrets.JOBS_TOKEN }}
          path: jobs
      - name: Use the job code for this run only
        run: cp -r jobs/build jobs/config.json jobs/package.json jobs/checks . && rm -rf jobs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 7-Zip
        run: which 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Check
        run: node build/test.js
      - name: Read prices
        run: node build/run.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_MINUTES: '300'
      - name: Deals
        if: always()
        run: node build/deals.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
      - name: Releases
        if: always()
        run: node build/releases.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
      - name: Mintipedia
        if: always()
        run: node build/mintipedia.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
      - name: News
        if: always()
        run: node build/news.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Events
        if: always()
        run: node build/events.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: eBay catalog numbers
        if: always()
        run: node build/catalog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
      - name: Exchange rates
        if: always()
        run: node build/rates.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Graded prices
        if: always()
        run: node build/graded.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PI_KEY: ${{ secrets.PI_KEY }}
      - name: Grading companies
        if: always()
        run: node build/grading.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the other daily jobs when due
        # GitHub skips scheduled start times on busy days, so this hourly job (which keeps itself going) also starts:
        # the Cloudflare copy every 3 hours, the picture job once a day after 3:43 AM ET, the R2 price history once a day
        # after 12:13 PM ET – each only when it has not run in that window and is not already running.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s); today=$(TZ=America/New_York date +%F); hm=$(TZ=America/New_York date +%H%M)
          busy() { gh run list -w "$1" -L 5 --json status -q '[.[] | select(.status!="completed")] | length'; }
          last() { gh run list -w "$1" -L 1 --json createdAt -q '.[0].createdAt // ""'; }
          etday() { [ -n "$1" ] && TZ=America/New_York date -d "$1" +%F || echo none; }
          etmin() { [ -n "$1" ] && TZ=America/New_York date -d "$1" +%H%M || echo 0000; }
          l=$(last "Data to Cloudflare")
          if [ "$(busy 'Data to Cloudflare')" = "0" ] && { [ -z "$l" ] || [ $(( now - $(date -d "$l" +%s) )) -ge 10500 ]; }; then gh workflow run cfdata.yml --ref main && echo "Cloudflare copy started"; fi
          l=$(last "CardTrader pictures")
          if [ "$hm" -ge 0343 ] && [ "$(busy 'CardTrader pictures')" = "0" ] && [ "$(etday "$l")" != "$today" ]; then gh workflow run pictures-ct.yml --ref main && echo "picture job started"; fi
          l=$(last "Price history to R2")
          if [ "$hm" -ge 1213 ] && [ "$(busy 'Price history to R2')" = "0" ] && { [ "$(etday "$l")" != "$today" ] || [ "$(etmin "$l")" -lt 1213 ]; }; then gh workflow run r2history.yml --ref main && echo "R2 price history started"; fi
      - name: Next run
        # GitHub's hourly schedule can be skipped for days, so the job keeps itself going:
        # wait until about an hour after this run started, then start the next run if none is waiting.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          started=$(date -d "$(gh run view ${{ github.run_id }} --json startedAt -q .startedAt)" +%s)
          left=$(( started + 3500 - $(date +%s) ))
          if [ $left -gt 0 ]; then sleep $left; fi
          waiting=$(gh run list -w Prices --json status -q '[.[] | select(.status=="queued" or .status=="waiting" or .status=="pending")] | length')
          if [ "$waiting" = "0" ]; then gh workflow run Prices --ref main; echo "next run started"; else echo "a run is already waiting"; fi
