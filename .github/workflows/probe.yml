name: probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete probe --yes --cleanup-tag || true
