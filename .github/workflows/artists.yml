name: Artists
# Who drew each card (Pokémon, Magic, Lorcana, Star Wars Unlimited, Riftbound, Flesh and Blood): publishes
# prices/artists.json.gz. Daily; the first runs carry on reading Pokémon where the last one stopped.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['build/artists.js']
permissions:
  contents: write
concurrency:
  group: artists
  cancel-in-progress: false
jobs:
  artists:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Artists
        run: node --max-old-space-size=7000 build/artists.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTISTS_MINUTES: '45'
