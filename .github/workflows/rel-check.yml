# One-off: what TCGplayer's product details say about upcoming sets. Results in the "checks" release.
name: Release details check
on:
  push:
    paths: ['tools/rel-check.js', '.github/workflows/rel-check.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/rel-check.js
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload checks rel-check.json --clobber
