name: Cloudflare check
# One-off check that the Cloudflare key works: Pages projects and R2 storage. Prints only yes/no and names, never the key.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "key valid:"; api /user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "pages projects:"; api /accounts/$CF_ACCOUNT/pages/projects | jq -c '{success, names: [.result[]?.name], errors: [.errors[]?.message]}'
          echo "r2 buckets:"; api /accounts/$CF_ACCOUNT/r2/buckets | jq -c '{success, names: [.result.buckets[]?.name], errors: [.errors[]? | (.code|tostring) + " " + .message]}'
