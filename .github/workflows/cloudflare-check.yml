name: Cloudflare check
# One-off check that the Cloudflare key works: Pages projects and R2 storage. Prints only yes/no and names, never the key.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf %s "$CF_TOKEN" | tr -d '[:space:]'); A=$(printf %s "$CF_ACCOUNT" | tr -d '[:space:]')
          case "$CF_TOKEN" in *Bearer*) echo "the saved key holds more than the key (looks like the curl line) – using the part after Bearer"; T=$(printf %s "$CF_TOKEN" | grep -o 'Bearer[[:space:]]*[A-Za-z0-9_.-]*' | head -1 | sed 's/^Bearer[[:space:]]*//');; esac
          echo "words in the saved key: $(printf %s "$CF_TOKEN" | wc -w)"
          echo "key length: ${#T} (pasted ${#CF_TOKEN}); account id length: ${#A}"
          api() { curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4$1"; }
          echo "key valid (account token):"; api /accounts/$A/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "key valid (user token):"; api /user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "pages projects:"; api /accounts/$A/pages/projects | jq -c '{success, names: [.result[]?.name], errors: [.errors[]?.message]}'
          echo "r2 buckets:"; api /accounts/$A/r2/buckets | jq -c '{success, names: [.result.buckets[]?.name], errors: [.errors[]? | (.code|tostring) + " " + .message]}'
