name: ebay-sites
# One-off check of Minty's eBay searches on each eBay country site (tools/ebay-sites.js). Runs when this file or the
# script changes, or by hand. Result: release "checks", file ebay-sites.json.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ebay-sites.yml', 'tools/ebay-sites.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask each eBay site
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node tools/ebay-sites.js
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view checks >/dev/null 2>&1 || gh release create checks --title checks --notes "One-off checks for the app"
          gh release upload checks out/ebay-sites.json --clobber
