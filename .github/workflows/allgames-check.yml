# One-off: every game with releases in the window. Results in the "checks" release.
name: All games check
on:
  push:
    paths: ['tools/allgames-check.js', '.github/workflows/allgames-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/allgames-check.js
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload checks allgames-check.json --clobber
