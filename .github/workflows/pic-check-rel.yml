# One-off: which Releases pictures load. Results in the "checks" release.
name: Releases picture check
on:
  push:
    paths: ['tools/pic-check.js', '.github/workflows/pic-check-rel.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/pic-check.js
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload checks pic-check.json --clobber
